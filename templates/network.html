<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ session.name }} - pyLot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.21.1/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
</head>
<body data-session-id="{{ session.id }}">
    <a href="/" class="back-link">← Back to sessions</a>

    <div class="card header">
        <h1>{{ session.name }}</h1>
        <div class="stats">
            <div class="stat-box"><strong id="host-count">…</strong> hosts</div>
            <div class="stat-box"><strong id="classified-count">…</strong> classified by fingerprints</div>
            <div class="stat-box"><strong id="edge-count">…</strong> host pairs talking</div>
            <div class="stat-box"><strong id="packet-count">{{ '{:,}'.format(session.packet_count) }}</strong> packets</div>
            <div class="stat-box">Status: <strong id="status">{{ session.status }}</strong></div>
            <form id="stop-form" method="post" action="{{ url_for('stop_capture', session_id=session.id) }}"
                  class="{{ '' if session.status == 'capturing' else 'hidden' }}">
                <button type="submit" class="btn danger">Stop capture</button>
            </form>
        </div>
        <div class="legend" id="legend"></div>
        <div id="notice" class="notice hidden"></div>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" data-tab="graph">Graph</button>
            <button class="tab" data-tab="hosts">Hosts</button>
            <button class="tab" data-tab="flows">Flows</button>
        </div>

        <div id="tab-graph" class="tab-pane">
            <div class="toolbar">
                <input type="search" id="graph-filter" placeholder="Filter by IP, vendor, category, role, protocol..." style="width: 300px">
                <button class="btn secondary" id="fit">Fit to view</button>
                <button class="btn secondary" id="relayout">Re-layout</button>
                <button class="btn secondary hidden" id="refresh">Refresh</button>
                <button class="btn secondary hidden" id="collapse-toggle"></button>
                <span class="spacer"></span>
                <button class="btn secondary" id="export-png">PNG</button>
                <a class="btn secondary" href="/api/sessions/{{ session.id }}/graph" download="session_{{ session.id }}_graph.json">JSON</a>
                <a class="btn secondary" href="{{ url_for('export_hosts', session_id=session.id) }}">Hosts CSV</a>
                <a class="btn secondary" href="{{ url_for('export_flows', session_id=session.id) }}">Flows CSV</a>
            </div>
            <div id="cy"></div>
        </div>

        <div id="tab-hosts" class="tab-pane hidden">
            <div class="toolbar">
                <input type="search" id="hosts-filter" placeholder="Search IP, MAC, vendor, category, role, fingerprint..." style="width: 340px">
            </div>
            <div id="hosts-table"></div>
            <div id="hosts-pager" class="pager"></div>
        </div>

        <div id="tab-flows" class="tab-pane hidden">
            <div class="toolbar">
                <input type="search" id="flows-filter" placeholder="Search address, protocol or port..." style="width: 300px">
                <span id="flows-host" class="hidden"><span id="flows-host-label"></span> <button class="btn secondary" id="flows-host-clear">Show all</button></span>
            </div>
            <div id="flows-table"></div>
            <div id="flows-pager" class="pager"></div>
        </div>
    </div>

    <div id="panel" class="panel hidden"></div>

    <script src="{{ url_for('static', filename='session.js') }}"></script>
</body>
</html>
